<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kavindu Nadeeshan — Software & DevOps Engineer. Editorial technical portfolio: DevSecOps pipelines, Kubernetes, and infrastructure as code."
    />
    <meta name="author" content="Kavindu Nadeeshan" />
    <meta name="theme-color" content="#f4ebdd" />
    <!--
      Tab icon and mobile home-screen icon are the same vendored portrait photo
      (public/portrait.jpg → copied to dist/ by Vite). Self-hosted on purpose: a
      hotlinked icon would need a CSP exception and could disappear upstream.
    -->
    <link rel="icon" type="image/jpeg" href="/portrait.jpg" />
    <link rel="apple-touch-icon" href="/portrait.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&display=swap"
      rel="stylesheet"
    />
    <title>Kavindu Nadeeshan — Software &amp; DevOps Engineer · Technical Plate &amp; Editorial Folio</title>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Netlify form detection parses this file at deploy time — it cannot see
      the React-rendered form in src/components/Contact.tsx. This hidden copy
      registers the form; its input names must stay in sync with the JSX one.
      On a successful deploy Netlify strips the data-netlify attribute and
      injects the hidden form-name input itself.
    -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="reason" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
