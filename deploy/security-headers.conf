# ============================================================================
# Shared security headers — installed at /etc/nginx/snippets/security-headers.conf.
#
# nginx's add_header is *replace*, not merge: any location that declares its
# own add_header loses the parent's. So this snippet is `include`d in every
# location block instead of being set once at server level.
# ============================================================================

# --- clickjacking / MIME sniffing / referrer leakage -------------------------
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# --- camera / mic / geolocation never needed by a static folio --------------
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=()" always;

# --- CSP ---------------------------------------------------------------------
# The Vite build emits external scripts only; Google Fonts (stylesheet + woff2)
# and the inline SVG favicon are the sole cross-origin / inline exceptions.
# `lh3.googleusercontent.com` is the hotlinked staff-pass portrait in
# src/components/IdPass.tsx — without it the CSP blocks the <img>, onError
# fires, and the pass renders the "PORTRAIT // ON FILE" engraving instead.
# Prefer vendoring that photo into src/assets/ (then drop back to 'self' data:).
# `always` keeps headers on 3xx/4xx too (deep-link fallbacks return 200, but
# error_page paths must not ship an unheadered response).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

# --- HTTPS hardening ---------------------------------------------------------
# Only meaningful once TLS terminates in front of this container. With the
# `docker-compose.tls.yml` overlay, Caddy already sends a Strict-Transport-
# Security header for HTTPS sites, so leave this off to avoid two HSTS headers.
# Enable only if you terminate TLS at an LB that does not set it itself.
# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# --- Cross-origin resource policy --------------------------------------------
# Same-origin: blocks other sites from reading this page's fetchable resources.
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-XSS-Protection "0" always;
