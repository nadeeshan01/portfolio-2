# ============================================================================
# Production server block for the portfolio static build.
# Included by the base image's http {} context via /etc/nginx/conf.d/.
#
# Port comes from the unprivileged image (NGINX_PORT=8080) so `--user` mapping
# stays low-port-free. Override with an env substitution if you re-map it.
# ============================================================================

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Hide the nginx version from Server / error pages.
    server_tokens off;

    # --- transport -----------------------------------------------------------
    sendfile   on;
    tcp_nopush on;

    charset  utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    # --- compression ---------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/css
        text/plain
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # --- Liveness / readiness probe (used by HEALTHCHECK + compose + LBs) ----
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        include snippets/security-headers.conf;
        return 200 "ok\n";
    }

    # --- Hashed build assets (/assets/index-a1b2c3.js) -----------------------
    # Filenames change on every content change → safe to cache for a year and
    # mark immutable so browsers skip revalidation entirely.
    # `^~` so a hashed .svg/.woff2 here wins over the media regex below.
    # Only add_header is used: pairing `expires` with it would emit two
    # Cache-Control headers on the same response.
    location ^~ /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Fonts, favicons and other fingerprinted statics get a long cache too.
    location ~* \.(?:woff2?|ttf|otf|eot|png|jpe?g|gif|webp|avif|svg|ico)$ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        include snippets/security-headers.conf;
        try_files $uri =404;
    }

    # --- Document root -------------------------------------------------------
    # index.html is the deploy manifest (it points at new hashes) → always
    # revalidate, otherwise a deploy leaves visitors on a stale bundle.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Deep-link misses fall back to the SPA shell, not a bare 404 page.
    error_page 404 /index.html;

    # Never serve dotfiles (.git, .dockerignore, editor swap files).
    location ~ /\. {
        access_log off;
        log_not_found off;
        deny all;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
}
