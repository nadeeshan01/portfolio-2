# ============================================================================
# Two ecosystems, both weekly on Monday, so a burst of advisories arrives as
# one reviewable batch rather than a drip:
#
#   github-actions  every action pin in .github/workflows. They are full-SHA
#                   pins carrying a `# vX.Y.Z` comment, and scripts/pins.mjs
#                   fails CI when the SHA and the tag disagree — Dependabot is
#                   what keeps both moving together.
#   npm             app dependencies, grouped prod/dev and capped so a noisy
#                   lockfile can't bury anything.
#
# The `docker` ecosystem went away with the Dockerfile: there are no base-image
# digests left to bump, and Netlify owns the runtime now.
# ============================================================================

version: 2

updates:


  # Keep action pins current (checkout, setup-node, artifacts, codeql).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: UTC

  # App dependencies — grouped so a batch of transitive bumps is one PR, and
  # capped so a noisy lockfile can't bury anything else.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      prod-deps:
        dependency-type: production
      dev-deps:
        dependency-type: development
