name: docker

# ============================================================================
# Build → scan → publish the portfolio image to GHCR.
#
# Auth: GITHUB_TOKEN is pre-authorized for Packages on the same repo, so there
# are no extra secrets to rotate (needs `packages: write` permission below).
#
# Tags produced:
#   ghcr.io/<owner>/<repo>:<short-sha>   immutable, one per commit  ← deploy this
#   ghcr.io/<owner>/<repo>:sha-<full-sha> immutable, same commit
#   ghcr.io/<owner>/<repo>:main          moving, branch head
#   ghcr.io/<owner>/<repo>:1.2.3         semver, only for tagged releases
#   ghcr.io/<owner>/<repo>:latest        moves ONLY on a v* tag — branch pushes
#                                         never touch it, so it can't drift to a
#                                         half-reviewed state.
#
# Supply chain: Trivy gates the publish on CRITICAL/HIGH CVEs that have an
# upstream fix (`ignore-unfixed`), and SARIF findings land in the Security tab.
# Base images are digest-pinned in the Dockerfile, so Dependabot
# (.github/dependabot.yml) is what proposes new digests — the weekly rebuild
# alone cannot pick up patched bases.
#
# First push creates the package as PRIVATE. Flip it to public (package
# settings → "Make public") if unauthenticated nodes must pull it, or use
# `docker login ghcr.io` on the host with any PAT that has read:packages.
# ============================================================================

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Rebuild weekly at 04:10 UTC so base-image CVE fixes roll in automatically.
    - cron: "10 4 * * 1"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # everything else is granted per-job, least privilege

env:
  REGISTRY: ghcr.io
  # GHCR rejects uppercase in image names — lowercased in a step, used everywhere.
  BASE_IMAGE_NAME: ${{ github.repository }}
  # The workload identity this workflow signs as (cosign keyless). The deploy
  # job below verifies that a digest carries exactly this subject before it may
  # go live.
  SIGNING_SUBJECT: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/docker.yml

jobs:
  # --------------------------------------------------------------------------
  # PR gate: single-arch build, boot it, assert it actually serves.
  # --------------------------------------------------------------------------
  smoke:
    if: github.event_name == 'pull_request'
    name: build & smoke test (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image into the local daemon
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true                    # single platform only — no manifest list
          tags: portfolio:pr-${{ github.event.pull_request.number }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=pr
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,mode=min,scope=smoke

      - name: Run with production-grade restrictions
        run: |
          docker run -d --rm \
            --name portfolio-pr \
            --user 101:101 \
            --read-only \
            --tmpfs /tmp:size=16m \
            --tmpfs /var/cache/nginx:size=32m \
            --tmpfs /var/run:size=8m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -p 8080:8080 \
            portfolio:pr-${{ github.event.pull_request.number }}

      - name: Assert health, SPA fallback and headers
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 2
            [ "$i" -eq 20 ] && { docker logs portfolio-pr; exit 1; }
          done

          # Root document must be the built shell, hashed bundle must exist.
          html=$(curl -fsS http://127.0.0.1:8080/)
          grep -q '<div id="root">' <<<"$html"
          asset=$(grep -o '/assets/[A-Za-z0-9._-]*\.js' <<<"$html" | head -1)
          curl -fsS -o /dev/null "http://127.0.0.1:8080${asset}"

          # Deep link must resolve to the SPA shell, not a 404.
          [ "$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/any/deep/route)" = "200" ]

          # ...but a missing static asset must not hide behind that fallback: the
          # portrait has to arrive as image bytes, not as index.html.
          curl -fsS -o /dev/null -w '%{content_type}\n' http://127.0.0.1:8080/portrait.jpg | grep -q '^image/jpeg$'

          # Security headers must be present on every response shape.
          curl -fsSI http://127.0.0.1:8080/ | grep -i 'content-security-policy'
          curl -fsSI http://127.0.0.1:8080/ | grep -i 'x-content-type-options: nosniff'

          # Hashed bundle: one-year immutable, but still headered.
          asset_head=$(curl -fsSI "http://127.0.0.1:8080${asset}")
          grep -qi 'cache-control:.*immutable' <<<"$asset_head"
          grep -qi 'content-security-policy' <<<"$asset_head"

          # Document root must revalidate so deploys aren't stuck on stale shells.
          curl -fsSI http://127.0.0.1:8080/ | grep -qi 'cache-control:.*must-revalidate'

          # Dotfiles must be refused.
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/.env)" != "200" ]
          echo "container user: $(docker inspect -f '{{.Config.User}}' portfolio-pr)"

      - name: Scan for known CVEs in the final image
        if: always()
        continue-on-error: true   # report, don't block style-only PRs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: portfolio:pr-${{ github.event.pull_request.number }}
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true    # same policy as the blocking publish scan
          vuln-type: os,library

      - name: Teardown
        if: always()
        run: docker stop portfolio-pr || true

  # --------------------------------------------------------------------------
  # main / tags / cron: multi-arch publish with immutable tags + attestations.
  # --------------------------------------------------------------------------
  publish:
    if: github.event_name != 'pull_request'
    name: multi-platform publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write        # push to GHCR with the built-in token
      actions: read          # provenance / attestation lookups
      # Keyless cosign signing: exchanges the OIDC job token for a short-lived
      # Fulcio certificate. No private key exists to steal, and nothing is
      # stored in repo secrets. Granted to this job only.
      id-token: write
      security-events: write  # upload Trivy SARIF to the Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # arm64 (Apple Silicon, AWS Graviton) images need a qemu binfmt handler;
      # buildx then emits one manifest list covering both architectures.
      - name: Enable cross-arch emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Compute lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo "${BASE_IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # GITHUB_TOKEN authenticates to GHCR automatically — nothing stored.
      # The same token works for scheduled runs, so weekly rebuilds can publish.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (immutable + moving tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Immutable: every build traceable to an exact commit.
            type=sha,prefix=,format=short
            type=sha,prefix=sha-,format=long
            # Branch pointer.
            type=ref,event=branch
            type=ref,event=pr
            # Releases: v1.2.3 → 1.2.3, 1.2, 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # `latest` advances only on a version tag, never on a branch push:
            # deploying :latest then always means a reviewed release.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=editorial-devops-portfolio
          annotations: |
            org.opencontainers.image.description=React + Vite editorial DevOps portfolio on unprivileged nginx

      # Push the immutable, commit-scoped tags FIRST. Nothing moving depends on
      # this build until the scan below says the image is remediable-clean.
      - name: Build and push immutable SHA tags (amd64, arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          # Layer cache across runs; scope keeps PR/main caches from evicting each other.
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish
          # Provenance + SBOM make the pushed digest auditable (slsa provenance).
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing: the OIDC job token buys a short-lived Fulcio certificate
      # bound to this repo + workflow file, and the signature is recorded in Rekor.
      # There is no private key to store or leak. The deploy job below will not
      # roll out a digest that isn't signed by exactly this identity, so a
      # look-alike image (same name, different origin) cannot reach production
      # even if pushed.
      # Signed by digest, not tag — tags are mutable, digests are not.
      - name: Sign the published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      # Scan the pushed digest rather than a local copy — the multi-platform
      # build was pushed, not loaded, and this is the exact artifact that got
      # written to the registry. Trivy resolves the index to amd64 by default.
      #
      # exit-code 1 + ignore-unfixed: the build only fails on findings that have
      # an upstream patch available, so an unpatchable base CVE can't hold the
      # pipeline hostage. `images` needs registry creds because the package may
      # still be private.
      - name: Scan image for remediable CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library

      # Runs even when the scan above failed — that's the whole point: you get
      # the findings in the Security tab instead of a dead end in the log.
      # Private repos need GitHub Advanced Security enabled for this to land.
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # Only a clean scan reaches the moving tags, so `:main` and `:latest`
      # can never point at an image the pipeline rejected. Re-invoking the build
      # is cheap: every layer is a cache hit, so just new manifests are pushed.
      - name: Promote to branch and release tags
        if: success()
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=publish
          provenance: mode=max
          sbom: true

      - name: Summary
        run: |
          {
            echo "## Image published"
            echo ""
            echo '- **Digest:** `${{ steps.build.outputs.digest }}`'
            echo '- **Platforms:** linux/amd64, linux/arm64'
            echo '- **Trivy:** no fixable CRITICAL/HIGH findings'
            echo '- **Cosign:** signed keyless as `${{ env.SIGNING_SUBJECT }}`'
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              echo "Production deploy runs in the \`deploy\` job below, gated on the \`production\` environment."
            else
              echo "Manual deploy if needed:"
              echo '```bash'
              echo "IMAGE=${REGISTRY}/${IMAGE_NAME}:${SHORT_SHA} docker compose up -d --pull always"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # Release to the VPS. Lives in this workflow rather than a separate file so the
  # `needs: [publish]` edge is a real dependency — two workflows racing over the
  # same tag would otherwise let a deploy start before the image existed.
  #
  # Trust chain enforced here, in order:
  #   1. the tag was pushed by someone with write access (GitHub's own gate)
  #   2. publish succeeded, so CI built and scanned this exact digest
  #   3. cosign verifies a keyless signature from THIS repo + workflow file
  #   4. the environment gate (`production`) can require a human approver
  #   5. the server pulls BY DIGEST, never by a mutable tag
  #   6. health-gated rollout with automatic rollback to the last good digest
  #
  # Required repository secrets: SSH_DEPLOY_KEY, SSH_HOST, SSH_USER,
  # SSH_KNOWN_HOSTS.  Required variables: DEPLOY_DIR, SITE_URL.
  # See README “Server one-time setup”.
  # --------------------------------------------------------------------------
  deploy:
    name: release to production
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: production-deploy
      # Never cancel a half-finished deploy: the previous one may be mid-swap.
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read    # resolve + pull the release digest
      # No id-token here: verification only reads public Fulcio/Rekor state, and
      # a mintable OIDC token in a deploy job is a privilege it never needs.
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve the release tag to an immutable digest. Everything downstream —
      # verification, pull, rollback record — uses the digest, so a tag that is
      # re-pointed between steps cannot change what lands in production.
      - name: Resolve release digest
        id: ref
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${TAG}"
          # Go template, not JSON: this emits the bare digest with no surrounding
          # quotes to strip, so there is no escaping layer to get wrong.
          DIGEST="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')"
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "could not resolve a digest for $IMAGE" >&2; exit 1 ;;
          esac
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "target=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published **$IMAGE** → \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

      # Refuses anything not signed by this repo's docker.yml on main or a v* tag.
      # The issuer check is what makes the identity meaningful: without it, any
      # Fulcio-issued cert from any workload would validate.
      - name: Verify cosign signature
        env:
          TARGET: ${{ steps.ref.outputs.target }}
        run: |
          set -euo pipefail
          # Escape the subject for regexp use. A GitHub repo URL can only contain
          # alphanumerics and . _ - / : so `.` is the sole metacharacter to guard,
          # and bash substitution does it without a sed delimiter to trip over.
          SUBJ_ESC="${SIGNING_SUBJECT//./\\.}"
          IDENTITY_RE="^${SUBJ_ESC}@refs/(heads/main|tags/v.*)\$"
          echo "expecting signer matching: $IDENTITY_RE"
          cosign verify \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --certificate-identity-regexp "$IDENTITY_RE" \
            "$TARGET" | jq '.[0].signature // "signed"'

      - name: Set up SSH
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Fail closed: without a pinned host key there is no way to tell a
          # first connection from a man-in-the-middle, so refuse to connect.
          if [ -z "${SSH_KNOWN_HOSTS:-}" ]; then
            echo "SSH_KNOWN_HOSTS secret is required (ssh-keygen -F / scan the host once)." >&2
            exit 1
          fi
          echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          printf '%s\n' "$SSH_DEPLOY_KEY" | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - name: Deploy by digest
        env:
          TARGET: ${{ steps.ref.outputs.target }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          SITE_URL: ${{ vars.SITE_URL }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            "env TARGET='$TARGET' DEPLOY_DIR='$DEPLOY_DIR' SITE_URL='$SITE_URL' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_DIR"

          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.tls.yml"
          PREVIOUS="$(cat .previous_digest 2>/dev/null || true)"
          echo "current: ${PREVIOUS:-<none>}  ->  target: $TARGET"

          docker pull --quiet "$TARGET"

          # Record the target for compose, then recreate without any build.
          if grep -q '^IMAGE=' .env 2>/dev/null; then
            sed -i "s|^IMAGE=.*|IMAGE=$TARGET|" .env
          else
            printf 'IMAGE=%s\n' "$TARGET" >> .env
          fi
          $COMPOSE up -d --no-build --pull never

          healthy() {
            state=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' portfolio 2>/dev/null || echo missing)
            [ "$state" = healthy ]
          }

          ok=0
          for _ in $(seq 1 30); do
            if healthy && curl -fsS --max-time 5 "$SITE_URL/healthz" >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 3
          done

          if [ "$ok" = 1 ]; then
            printf '%s\n' "$TARGET" > .previous_digest
            docker image prune -f --filter 'until=168h' >/dev/null
            echo "deployed and healthy: $TARGET"
            exit 0
          fi

          echo "!! deployment unhealthy; rolling back" >&2
          $COMPOSE logs --tail 80 portfolio >&2 || true
          if [ -n "$PREVIOUS" ]; then
            sed -i "s|^IMAGE=.*|IMAGE=$PREVIOUS|" .env
            $COMPOSE up -d --no-build --pull never
            echo "rolled back to $PREVIOUS" >&2
          fi
          exit 1
          REMOTE

      - name: Report
        if: always()
        run: |
          {
            echo ""
            echo "- **Deployed:** \`${{ steps.ref.outputs.target }}\`"
            echo "- **Signature:** verified against \`${SIGNING_SUBJECT}\`"
          } >> "$GITHUB_STEP_SUMMARY"
