# ============================================================================
# TLS edge overlay — Caddy terminates HTTPS, the app stops being published.
#
#   cp deploy/Caddyfile.example deploy/Caddyfile   # put your real hostname in
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Explicit -f lists do NOT auto-merge sibling override files, so this stack is
# exactly base + this overlay. Check what compose resolved with:
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml config
# ============================================================================

services:
  portfolio:
    # `!reset` (Compose v2.24+) clears the base mapping instead of appending to
    # it, so 8080 stays host-private and the only ingress is Caddy.
    ports: !reset []
    expose:
      - "8080"

  caddy:
    # Digest of the caddy:2-alpine OCI index (amd64 + arm64) as of 2026-10-03.
    # Refresh: docker buildx imagetools inspect caddy:2-alpine
    image: caddy:2-alpine@sha256:881bbc60f9986d5ab8e7cfd6cf7e4ef3c9c0439fef2429d035d065577882f028
    container_name: portfolio-edge
    restart: unless-stopped

    ports:
      - "80:80"     # ACME HTTP-01 + the automatic redirect to HTTPS
      - "443:443"   # TLS-ALPN; the only public entry point for the site

    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # ACME account + issued certs survive rebuilds
      - caddy_config:/config    # resolved config, avoids re-issue on restart

    # ACME challenges come from Caddy, so it must not start before the app can
    # answer them; `service_healthy` waits on the /healthz probe, not just boot.
    depends_on:
      portfolio:
        condition: service_healthy

    # The proxy runs as root to bind 80/443, so it gets the smallest capability
    # set that still works: port binding only, nothing else.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 96M

    stop_grace_period: 20s      # finish in-flight requests before tearing down
    init: true

    healthcheck:
      # The admin API binds 127.0.0.1:2019 inside the container — reachable for
      # a liveness probe, never exposed to the network.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - web

volumes:
  caddy_data:
  caddy_config:
